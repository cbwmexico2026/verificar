<style>
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;background:#ffffff;color:#2B2B33}
.barra{height:6px;background:linear-gradient(90deg,#A22A86 80%,#7CB828 80%)}
.wrap{max-width:460px;margin:0 auto;padding:26px 20px 40px}
.logo{display:block;width:220px;max-width:70%;height:auto}
.fechas{margin-top:8px;font-size:13px;color:#5B5B66}
.card{margin-top:22px;background:#fff;border:1.5px solid rgba(124,184,40,.55);border-radius:18px;padding:24px 20px;text-align:center;min-height:180px}
.est{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.ok{background:#EAF5DC;color:#4E7F14}.no{background:#FCE4EF;color:#B0125F}.esp{background:#F1EEF3;color:#5B5B66}
h1{margin:16px 0 4px;font-size:25px;line-height:1.2;color:#E3107F;word-wrap:break-word}
.sub{font-size:13px;color:#5B5B66;font-weight:300}
.datos{margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.d{background:#F7F4F7;border-radius:12px;padding:10px 12px}
.d b{display:block;font-size:11px;letter-spacing:1px;color:#A22A86;font-weight:600}
.d span{font-size:15px}.full{grid-column:1/3}
.pie{margin-top:22px;font-size:12px;color:#5B5B66;text-align:center;line-height:1.5}
.pie a{color:#A22A86}
.giro{width:28px;height:28px;margin:30px auto 10px;border:3px solid #EAD6E6;border-top-color:#A22A86;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style>

      const vigente = String(d.estado || '').toLowerCase().indexOf('válida') === 0;
      if (!vigente) {
        card.innerHTML = '<div class="est no">Constancia ' + esc(String(d.estado).toLowerCase()) + '</div><h1>' + esc(d.folio) + '</h1><div class="sub">Esta constancia no está vigente. Escríbenos para cualquier aclaración.</div>';
        return;
      }
      const h = String(d.horas) === '1' ? 'hora' : 'horas';
      card.innerHTML = '<div class="est ok">✓ Constancia válida</div>'
        + '<h1>' + esc(d.nombre) + '</h1><div class="sub">Constancia de participación como asistente</div>'
        + '<div class="datos"><div class="d"><b>FOLIO</b><span>' + esc(d.folio) + '</span></div>'
        + '<div class="d"><b>DURACIÓN</b><span>' + esc(d.horas) + ' ' + h + '</span></div>'
        + '<div class="d full"><b>PARTICIPACIÓN</b><span>' + esc(d.tipo) + ' · ' + esc(d.modalidad) + '</span></div></div>';
    })
    .catch(() => {
      card.innerHTML = '<div class="est esp">Sin conexión</div><h1>' + esc(folio) + '</h1><div class="sub">No pudimos consultar la constancia en este momento. Revisa tu conexión e inténtalo de nuevo.</div>';
    });
}
</script>
</body>
</html>
