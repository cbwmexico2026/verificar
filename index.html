<style>
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;background:#ffffff;color:#2B2B33}
.barra{height:6px;background:linear-gradient(90deg,#A22A86 80%,#7CB828 80%)}
.wrap{max-width:460px;margin:0 auto;padding:26px 20px 40px}
.logo{display:block;width:220px;max-width:70%;height:auto}
.fechas{margin-top:8px;font-size:13px;color:#5B5B66}
.card{margin-top:22px;background:#fff;border:1.5px solid rgba(124,184,40,.55);border-radius:18px;padding:24px 20px;text-align:center;min-height:180px}
.est{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.ok{background:#EAF5DC;color:#4E7F14}.no{background:#FCE4EF;color:#B0125F}.esp{background:#F1EEF3;color:#5B5B66}
h1{margin:16px 0 4px;font-size:25px;line-height:1.2;color:#E3107F;word-wrap:break-word}
.sub{font-size:13px;color:#5B5B66;font-weight:300}
.datos{margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.d{background:#F7F4F7;border-radius:12px;padding:10px 12px}
.d b{display:block;font-size:11px;letter-spacing:1px;color:#A22A86;font-weight:600}
.d span{font-size:15px}.full{grid-column:1/3}
.pie{margin-top:22px;font-size:12px;color:#5B5B66;text-align:center;line-height:1.5}
.pie a{color:#A22A86}
.giro{width:28px;height:28px;margin:30px auto 10px;border:3px solid #EAD6E6;border-top-color:#A22A86;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style>

const card = document.getElementById('card');
const q = new URLSearchParams(location.search);
const f = (q.get('f') || '').replace(/[^0-9]/g, '');
const c = (q.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const folio = f ? 'CBW2026-' + f.padStart(3, '0') : '';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function noEncontrada(t){
  card.innerHTML = '<div class="est no">No encontrada</div><h1>' + esc(folio || 'Sin folio') + '</h1><div class="sub">' + t + '</div>';
}
async function verificar(){
  if (!f || !c) { noEncontrada('Escanea el código QR de tu constancia para verificarla.'); return; }
  const reg = D[folio];
  if (!reg) { noEncontrada('No encontramos una constancia con estos datos. Escríbenos para cualquier aclaración.'); return; }
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(c), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode('CBW2026|' + folio), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const raw = Uint8Array.from(atob(reg), ch => ch.charCodeAt(0));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    const d = JSON.parse(new TextDecoder().decode(pt));
    if (String(d.e).toLowerCase().indexOf('válida') !== 0) {
      card.innerHTML = '<div class="est no">Constancia ' + esc(String(d.e).toLowerCase()) + '</div><h1>' + esc(folio) + '</h1><div class="sub">Esta constancia no está vigente. Escríbenos para cualquier aclaración.</div>';
      return;
    }
    card.innerHTML = '<div class="est ok">✓ Constancia válida</div>'
      + '<h1>' + esc(d.n) + '</h1><div class="sub">Constancia de participación como asistente</div>'
      + '<div class="datos"><div class="d"><b>FOLIO</b><span>' + esc(folio) + '</span></div>'
      + '<div class="d"><b>DURACIÓN</b><span>' + esc(d.h) + ' ' + (d.h === 1 ? 'hora' : 'horas') + '</span></div>'
      + '<div class="d full"><b>PARTICIPACIÓN</b><span>' + esc(d.t) + ' · ' + esc(d.m) + '</span></div></div>';
  } catch (e) {
    noEncontrada('No encontramos una constancia con estos datos. Escríbenos para cualquier aclaración.');
  }
}
verificar();
